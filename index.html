// ── Set today's date using phone local time ──
document.getElementById("date").value = getPhoneDateStr();

function getPhoneDateStr(){
  let n=new Date();
  return n.getFullYear()+"-"+String(n.getMonth()+1).padStart(2,"0")+"-"+String(n.getDate()).padStart(2,"0");
}

// ── Get date in TARGET CITY timezone ──
function getCityDateStr(tzOffset){
  let now=new Date();
  // Get total city minutes from start of today UTC
  let utcMs = now.getTime();
  let cityMs = utcMs + tzOffset*3600000;
  let cityDate = new Date(cityMs);
  return cityDate.getUTCFullYear()+"-"+
         String(cityDate.getUTCMonth()+1).padStart(2,"0")+"-"+
         String(cityDate.getUTCDate()).padStart(2,"0");
}

// Track if user manually changed the date
let userPickedDate = false;

// ── AUTO DATE ROLLOVER (checks every minute, works for any location) ──
// Fixes: if the page is left open across local midnight, the date field
// previously only updated when the user typed a city or changed the date.
// This background check refreshes it automatically for whichever city/
// location is currently shown, without overriding a manually picked date.
setInterval(function(){
  if(userPickedDate) return; // respect user's manual date choice
  let cityVal=document.getElementById("city").value.trim();
  if(!cityVal && gpsLat===null) return;

  let tzName=null;
  if(cityVal){
    let cityData=findCity(cityVal);
    if(cityData){
      tzName=cityData.tz;
    }else if(gpsLat!==null){
      tzName=guessTz(gpsLat,gpsLon);
    }
  }else if(gpsLat!==null){
    tzName=guessTz(gpsLat,gpsLon);
  }
  if(!tzName) return;

  let currentDate=document.getElementById("date").value;
  let tz=getOffset(tzName,currentDate);
  let cityDate=getCityDateStr(tz);

  if(cityDate!==currentDate){
    calculate();
  }
},60000);

// ── Auto calculate on date change ──
document.getElementById("date").addEventListener("change", function(){
  userPickedDate = true; // user manually picked a date
  calculate();
});

// ── Auto calculate on city input ──
let autoTimer=null;
document.getElementById("city").addEventListener("input", function(){
  clearTimeout(autoTimer);
  userPickedDate = false; // city changed — reset to auto date
  if(document.getElementById("city").value.trim().length>=3)
    autoTimer=setTimeout(calculate,1500);
});

// ── Format minutes → 12hr time ──
function format(m){
  m=((m%1440)+1440)%1440;
  let h=Math.floor(m/60),mm=Math.round(m%60);
  let ampm=h<12?"AM":"PM",h12=h%12===0?12:h%12;
  return h12+":"+String(mm).padStart(2,"0")+" "+ampm;
}

function divide(s,e){
  let p=(e-s)/8,a=[];
  for(let i=0;i<8;i++)a.push([s+i*p,s+(i+1)*p]);
  return a;
}

function inP(t,s,e){return t>=s&&t<e;}

function findCity(name){
  let k=name.trim().toLowerCase();
  if(CITIES[k])return CITIES[k];
  for(let key in CITIES){
    if(key.includes(k)||k.includes(key))return CITIES[key];
  }
  return null;
}

// ── Get UTC offset including DST using browser Intl ──
function getOffset(tzName, dateStr){
  try{
    let d=new Date(dateStr+"T12:00:00Z");
    let a=new Date(d.toLocaleString("en-US",{timeZone:tzName}));
    let b=new Date(d.toLocaleString("en-US",{timeZone:"UTC"}));
    return(a-b)/3600000;
  }catch(e){return 5.5;}
}

// ── Guess timezone from coordinates ──
function guessTz(lat,lon){
  if(lon>=68&&lon<=98&&lat>=6&&lat<=38)return"Asia/Kolkata";
  if(lon>=80&&lon<=89&&lat>=26&&lat<=31)return"Asia/Kathmandu";
  if(lon>=-10&&lon<=2&&lat>=49&&lat<=61)return"Europe/London";
  if(lon>=44&&lon<=60&&lat>=20&&lat<=40)return"Asia/Dubai";
  if(lon>=-80&&lon<=-65&&lat>=25&&lat<=50)return"America/New_York";
  if(lon>=-100&&lon<=-80&&lat>=25&&lat<=50)return"America/Chicago";
  if(lon>=-120&&lon<=-100&&lat>=25&&lat<=50)return"America/Los_Angeles";
  if(lon>=100&&lon<=145&&lat>=30&&lat<=50)return"Asia/Tokyo";
  if(lon>=103&&lon<=105&&lat>=1&&lat<=2)return"Asia/Singapore";
  return"UTC";
}

// ── Sunrise/Sunset ──
async function getSun(lat,lon,date,tz){
  let r=await fetch("https://api.sunrise-sunset.org/json?lat="+lat+"&lng="+lon+"&date="+date+"&formatted=0");
  let d=await r.json();
  if(!d||d.status!=="OK")throw new Error("Cannot get sun times. Check internet connection.");
  // WRAP to 0-1439 to handle high UTC offsets like Auckland UTC+13
  // Without wrapping, Auckland sunrise = 1885 mins causing reversed segments
  function toLocal(u){
    let utcMins=new Date(u).getUTCHours()*60+new Date(u).getUTCMinutes();
    return((utcMins+tz*60)%1440+1440)%1440;
  }
  return{sunrise:toLocal(d.results.sunrise),sunset:toLocal(d.results.sunset)};
}

const cycle=["Amrit","Char","Rog","Kaal","Labh","Udveg","Shubh"];
const daySeqs={
  0:["Udveg","Char","Labh","Amrit","Kaal","Shubh","Rog","Udveg"],
  1:["Amrit","Kaal","Shubh","Rog","Udveg","Char","Labh","Amrit"],
  2:["Rog","Udveg","Char","Labh","Amrit","Kaal","Shubh","Rog"],
  3:["Labh","Amrit","Kaal","Shubh","Rog","Udveg","Char","Labh"],
  4:["Shubh","Rog","Udveg","Char","Labh","Amrit","Kaal","Shubh"],
  5:["Char","Labh","Amrit","Kaal","Shubh","Rog","Udveg","Char"],
  6:["Kaal","Shubh","Rog","Udveg","Char","Labh","Amrit","Kaal"]
};
function getNightSeq(d){
  let idx=(cycle.indexOf(d[7])+1)%7,n=[];
  for(let i=0;i<8;i++)n.push(cycle[(idx+i)%7]);
  return n;
}
const rahuIdx=[7,1,6,4,5,3,2];
const yamaIdx=[4,3,2,1,0,6,5];
const kvIdx={0:4,1:1,2:5,3:2,4:6,5:3,6:0};
const vvIdx={0:3,1:6,2:1,3:4,4:7,5:2,6:5};
const krIdx={0:5,1:3,2:1,3:6,4:4,5:2,6:0};
function getPd(sr,ss,i){let p=(ss-sr)/8;return[sr+p*i,sr+p*(i+1)];}

function quality(n,s,rahu,yama,kv,vv,kr){
  if(inP(s,rahu[0],rahu[1]))return"RAHU";
  if(inP(s,yama[0],yama[1]))return"YAMA";
  if(inP(s,kv[0],kv[1]))return"Kaal Vela";
  if(inP(s,vv[0],vv[1]))return"Vaar Vela";
  if(inP(s,kr[0],kr[1]))return"Kaal Ratri";
  if(["Amrit","Shubh","Labh"].includes(n))return"BEST";
  if(n==="Char")return"GOOD";
  return"Inauspicious";
}

function badge(q){

  if(q==="GOOD")return'<span style="color:orange;font-weight:bold">GOOD</span>';
  return'<span style="color:red;font-weight:bold">'+q+'</span>';
}

// ── MAIN CALCULATE ──
async function calculate(){
  let cityVal=document.getElementById("city").value.trim();
  let date=document.getElementById("date").value;
  if(!cityVal&&!gpsLat)return;
  if(!date){
    date=getPhoneDateStr();
    document.getElementById("date").value=date;
  }

  document.getElementById("status").textContent="Calculating...";
  document.getElementById("output").innerHTML="";

  try{
    let lat,lon,tzName,cityName;

    if(cityVal){
      let cityData=findCity(cityVal);
      if(cityData){
        lat=cityData.lat;lon=cityData.lon;tzName=cityData.tz;cityName=cityVal;
      }else if(gpsLat){
        lat=gpsLat;lon=gpsLon;tzName=guessTz(lat,lon);cityName=cityVal;
      }else{
        try{
          let r=await fetch("https://nominatim.openstreetmap.org/search?q="+encodeURIComponent(cityVal)+"&format=json&limit=1");
          let d=await r.json();
          if(!d||d.length===0)throw new Error("City not found");
          lat=+d[0].lat;lon=+d[0].lon;tzName=guessTz(lat,lon);cityName=cityVal;
        }catch(e){
          throw new Error("'"+cityVal+"' not found. Try: Mumbai, Delhi, London, Dubai");
        }
      }
    }else{
      lat=gpsLat;lon=gpsLon;tzName=guessTz(lat,lon);cityName="Your Location";
    }

    // Get UTC offset including DST
    let tz=getOffset(tzName,date);

    // ── KEY FIX: Use CITY's local date not phone's date ──
    let cityDate=getCityDateStr(tz);

    // Auto-update date to city's local date UNLESS user manually picked a date
    // This ensures: Chennai=23 Mar, Ashburn=22 Mar automatically
    // But if user picks a future/past date manually, respect their choice
    if(!userPickedDate && cityDate!==date){
      date=cityDate;
      document.getElementById("date").value=date;
    }

    // Current time in CITY
    let nowUTC=new Date();
    let nowCity=((nowUTC.getUTCHours()*60+nowUTC.getUTCMinutes()+tz*60)%1440+1440)%1440;

    // Is current time before today's sunrise in this city?
    // First get today's sun to check sunrise
    let sun=await getSun(lat,lon,date,tz);

    let isBeforeSunrise=nowCity<sun.sunrise;

    // Next day sun times
    let nextD=new Date(date+"T12:00:00Z");
    nextD.setUTCDate(nextD.getUTCDate()+1);
    let sun2=await getSun(lat,lon,nextD.toISOString().split("T")[0],tz);

    // Previous day sun times — for current muhurat when before sunrise
    let prevD=new Date(date+"T12:00:00Z");
    prevD.setUTCDate(prevD.getUTCDate()-1);
    let prevDateStr=prevD.toISOString().split("T")[0];
    let sunPrev=await getSun(lat,lon,prevDateStr,tz);

    let wd=new Date(date+"T12:00:00Z").getUTCDay();
    let daySeq=daySeqs[wd];
    let nightSeq=getNightSeq(daySeq);
    let daySeg=divide(sun.sunrise,sun.sunset);
    let nightSeg=divide(sun.sunset,sun2.sunrise+1440);

    let rahu=getPd(sun.sunrise,sun.sunset,rahuIdx[wd]);
    let yama=getPd(sun.sunrise,sun.sunset,yamaIdx[wd]);
    let kv=getPd(sun.sunrise,sun.sunset,kvIdx[wd]);
    let vv=getPd(sun.sunrise,sun.sunset,vvIdx[wd]);
    let kr=nightSeg[krIdx[wd]];

    // isToday = viewing city's current date
    let isToday=(date===cityDate);
    let tzSign=tz>=0?"+":"";

    // Festival of the day
    let festToday="";
    let yr=new Date(date+"T12:00:00Z").getFullYear();
    if(MY_FESTIVALS[yr]){
      MY_FESTIVALS[yr].forEach(([fd,fn])=>{
        if(fd===date)festToday+=(festToday?" | ":"")+fn;
      });
    }

    // ── BUILD OUTPUT ──
    let dayName=new Date(date+"T12:00:00Z").toLocaleDateString("en-IN",{weekday:"long"});
    let html="<h3>"+cityName+"</h3>";
    html+="<div style='color:#555;font-size:15px'>"+tzName+" (UTC"+tzSign+tz+"h)</div>";

    // Date + Day + Festival on one line
    let dateLine="<b>"+date+"</b> &nbsp; <b>"+dayName+"</b>";
    if(festToday)dateLine+=" &nbsp;|&nbsp; <span style='font-weight:900;color:green'>"+festToday+"</span>";
    html+="<div style='font-size:18px;color:#111;margin:6px 0'>"+dateLine+"</div>";

    html+="Sunrise: <b>"+format(sun.sunrise)+"</b> &nbsp;|&nbsp; Sunset: <b>"+format(sun.sunset)+"</b><br>";

    // Rahu Yama KV VV KR on one line
    html+="<div style='font-size:16px;margin:6px 0;line-height:2'>";
    html+="<span style='color:red;font-weight:bold'>Rahu</span> "+format(rahu[0])+"-"+format(rahu[1]);
    html+=" &nbsp; <span style='color:red;font-weight:bold'>Yama</span> "+format(yama[0])+"-"+format(yama[1]);
    html+=" &nbsp; <span style='color:red;font-weight:bold'>KV</span> "+format(kv[0])+"-"+format(kv[1]);
    html+=" &nbsp; <span style='color:red;font-weight:bold'>VV</span> "+format(vv[0])+"-"+format(vv[1]);
    html+=" &nbsp; <span style='color:red;font-weight:bold'>KR</span> "+format(kr[0])+"-"+format(kr[1]);
    html+="</div>";
    html+="<small style='color:#888'>All times in "+cityName+" local time</small>";

    // Best Muhurat
    let best=[];
    daySeg.forEach((s,i)=>{
      let n=daySeq[i];
      if(!["Amrit","Shubh","Labh"].includes(n))return;
      if(quality(n,s[0],rahu,yama,kv,vv,kr)==="BEST")
        best.push(n+": "+format(s[0])+" - "+format(s[1]));
    });
    html+='<div class="box" style="border-color:green;background:#eaffea"><b>Best Muhurat</b><br>'+(best.length?best.join("<br>"):"None today")+"</div>";

    // ── CURRENT MUHURAT ──
    if(isToday){
      let cur="",curQ="",curTime="",curNote="";

      if(isBeforeSunrise){
        // After midnight, before sunrise → use YESTERDAY's night segments
        let prevWd=new Date(prevDateStr+"T12:00:00Z").getUTCDay();
        let prevDaySeq=daySeqs[prevWd];
        let prevNSeq=getNightSeq(prevDaySeq);
        let prevNSeg=divide(sunPrev.sunset,sun.sunrise+1440);
        let pRahu=getPd(sunPrev.sunrise,sunPrev.sunset,rahuIdx[prevWd]);
        let pYama=getPd(sunPrev.sunrise,sunPrev.sunset,yamaIdx[prevWd]);
        let pKv=getPd(sunPrev.sunrise,sunPrev.sunset,kvIdx[prevWd]);
        let pVv=getPd(sunPrev.sunrise,sunPrev.sunset,vvIdx[prevWd]);
        let pKr=prevNSeg[krIdx[prevWd]];
        let nowExt=nowCity+1440; // extend past midnight
        prevNSeg.forEach((s,i)=>{
          // Match segments that are past midnight (s[0]>=1440)
          // OR segments that straddle midnight (s[0]<1440 but s[1]>1440)
          let matches = false;
          if(s[0]>=1440 && nowExt>=s[0] && nowExt<s[1]){
            matches=true; // fully after midnight segment
          }else if(s[0]<1440 && s[1]>1440 && nowExt>=s[0] && nowExt<s[1]){
            matches=true; // segment straddling midnight
          }
          if(matches){
            cur=prevNSeq[i];
            curQ=quality(cur,s[0],pRahu,pYama,pKv,pVv,pKr);
            curTime=format(s[0])+" - "+format(s[1]);
            curNote="(Before sunrise — last night "+prevDateStr+")";
          }
        });
      }else{
        // Daytime or evening → use today's segments
        daySeg.forEach((s,i)=>{
          if(nowCity>=s[0]&&nowCity<s[1]){
            cur=daySeq[i];curQ=quality(cur,s[0],rahu,yama,kv,vv,kr);
            curTime=format(s[0])+" - "+format(s[1]);
          }
        });
        if(!cur){
          nightSeg.forEach((s,i)=>{
            if(s[0]<1440&&nowCity>=s[0]&&nowCity<Math.min(s[1],1440)){
              cur=nightSeq[i];curQ=quality(cur,s[0],rahu,yama,kv,vv,kr);
              curTime=format(s[0])+" - "+format(s[1]);
            }
            if(s[0]<1440&&s[1]>1440&&nowCity>=s[0]){
              cur=nightSeq[i];curQ=quality(cur,s[0],rahu,yama,kv,vv,kr);
              curTime=format(s[0])+" - "+format(s[1]);
            }
          });
        }
      }

      html+='<div class="box" style="border-color:blue;background:#eef4ff">';
      html+="<b>Current Muhurat in "+cityName+"</b>";
      if(curNote)html+="<br><small style='color:#888'>"+curNote+"</small>";
      html+="<br>"+(cur?cur+" &nbsp;"+curTime+" &nbsp;"+badge(curQ):"Unable to detect");
      html+="</div>";
    }

    // Day Table
    html+="<h3>Day Choghadiya</h3><table><tr><th>#</th><th>Time</th><th>Name</th><th>Quality</th></tr>";
    daySeg.forEach((s,i)=>{
      let q=quality(daySeq[i],s[0],rahu,yama,kv,vv,kr);
      let now=isToday&&!isBeforeSunrise&&nowCity>=s[0]&&nowCity<s[1];
      html+="<tr"+(now?' style="background:#fffde7;font-weight:bold"':"")+">";
      html+="<td>"+(i+1)+"</td><td>"+format(s[0])+"–"+format(s[1])+"</td>";
      html+="<td>"+daySeq[i]+(now?" ◀":"")+"</td><td>"+badge(q)+"</td></tr>";
    });
    html+="</table>";

    // Night Table
    html+="<h3>Night Choghadiya</h3><table><tr><th>#</th><th>Time</th><th>Name</th><th>Quality</th></tr>";
    nightSeg.forEach((s,i)=>{
      let q=quality(nightSeq[i],s[0],rahu,yama,kv,vv,kr);
      let now=isToday&&!isBeforeSunrise&&s[0]<1440&&nowCity>=s[0]&&nowCity<Math.min(s[1],1440);
      html+="<tr"+(now?' style="background:#fffde7;font-weight:bold"':"")+">";
      html+="<td>"+(i+1)+"</td><td>"+format(s[0])+"–"+format(s[1])+"</td>";
      html+="<td>"+nightSeq[i]+(now?" ◀":"")+"</td><td>"+badge(q)+"</td></tr>";
    });
    html+="</table>";

    document.getElementById("output").innerHTML=html;
    document.getElementById("status").textContent=cityName+" | "+tzName+" (UTC"+tzSign+tz+"h)";

  }catch(err){
    document.getElementById("status").textContent="Error: "+err.message;
    document.getElementById("output").innerHTML='<div style="color:red;padding:12px">'+err.message+'</div>';
    console.error(err);
  }
}

// ── TEXT-TO-SPEECH for Pachkhan (browser built-in, no audio files needed) ──
function stripHtmlForSpeech(str){
  return str.replace(/<br\s*\/?>/gi,". ").replace(/<[^>]+>/g,"");
}

function speakPachkhanItem(idx, btn){
  if(!("speechSynthesis" in window)){
    alert("Sorry, this browser does not support text-to-speech.");
    return;
  }
  // If this same button is already playing, treat click as Stop
  if(btn.classList.contains("playing")){
    window.speechSynthesis.cancel();
    return;
  }
  window.speechSynthesis.cancel(); // stop any other item that was playing
  let data = appLang==="hi" ? PACHKHAN_HI : PACHKHAN_EN;
  let text = stripHtmlForSpeech(data[idx][1]);
  let utter = new SpeechSynthesisUtterance(text);
  utter.lang = appLang==="hi" ? "hi-IN" : "en-IN";
  utter.rate = 0.85;

  // Reset all play buttons, then mark this one as playing
  document.querySelectorAll(".playbtn").forEach(b=>{b.classList.remove("playing");b.textContent="🔊 Play";});
  btn.classList.add("playing");
  btn.textContent="⏹ Stop";

  utter.onend=function(){btn.classList.remove("playing");btn.textContent="🔊 Play";};
  utter.onerror=function(){btn.classList.remove("playing");btn.textContent="🔊 Play";};

  window.speechSynthesis.speak(utter);
}

function renderPachkhan(){
  let data = appLang==="hi" ? PACHKHAN_HI : PACHKHAN_EN;
  let heading = appLang==="hi" ? "पच्चक्खाण" : "Pachkhan";
  window.speechSynthesis && window.speechSynthesis.cancel(); // stop audio from a stale render
  let html="<h3>"+heading+"</h3>";
  data.forEach(([name,text],i)=>{
    html+='<div class="vowitem"><h4>'+name+'</h4><p>'+text+'</p>'+
          '<button type="button" class="playbtn" onclick="speakPachkhanItem('+i+',this)">🔊 Play</button></div>';
  });
  document.getElementById("pachBox").innerHTML=html;
}

function renderNiyam(){
  let data = appLang==="hi" ? NIYAM_HI : NIYAM_EN;
  let intro = appLang==="hi" ? NIYAM_INTRO_HI : NIYAM_INTRO_EN;
  let heading = appLang==="hi" ? "चौदह नियम" : "14 Niyam";
  let html="<h3>"+heading+"</h3><div class='vowitem'><p>"+intro+"</p></div>";
  data.forEach(([name,text])=>{

  });
  document.getElementById("niyamBox").innerHTML=html;
}

function togglePachkhan(){
  let box=document.getElementById("pachBox");
  if(box.style.display==="none"||!box.style.display){
    renderPachkhan();
    box.style.display="block";
  }else{
    window.speechSynthesis && window.speechSynthesis.cancel();
    box.style.display="none";
  }
}

function toggleNiyam(){
  let box=document.getElementById("niyamBox");
  if(box.style.display==="none"||!box.style.display){
    renderNiyam();
    box.style.display="block";
  }else{
    box.style.display="none";
  }
}

// ── FESTIVAL CALENDAR ──
const MONTH_NAMES=["January","February","March","April","May","June","July","August","September","October","November","December"];
const DAY_NAMES_F=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

function toggleFestivals(){
  let box=document.getElementById("festBox");
  if(box.style.display==="none"){
    let year=new Date().getFullYear();
    let fests=MY_FESTIVALS[year]||[];
    let today=getPhoneDateStr();
    if(fests.length===0){
      box.innerHTML="<h3>Festival Calendar</h3><p style='padding:12px'>No data for "+year+". Please update from Padmodaya calendar.</p>";
      box.style.display="block";return;
    }
    let html="<h3>Festival Calendar "+year+" — Jay Parshva Padmodaya</h3>";
    html+='<table class="ftable"><tr><th>Date</th><th>Festival</th></tr>';
    let lastMo="";
    fests.forEach(([fd,fn])=>{
      let mo=fd.substring(5,7);
      if(mo!==lastMo){
        html+='<tr class="fmonth"><td colspan="2">'+MONTH_NAMES[parseInt(mo)-1]+" "+year+"</td></tr>";
        lastMo=mo;
      }
      let d=new Date(fd+"T12:00:00Z");
      let label=DAY_NAMES_F[d.getUTCDay()]+", "+d.getUTCDate()+" "+MONTH_NAMES[d.getUTCMonth()].slice(0,3);
      let isToday=fd===today;
      html+='<tr class="'+(isToday?"ftoday":"")+'"><td>'+label+(isToday?" TODAY":"")+'</td><td>'+fn+'</td></tr>';
    });
    html+="</table>";
    box.innerHTML=html;
    box.style.display="block";
  }else{
    box.style.display="none";
  }
}

// ── AUTO DETECT LOCATION ──
window.addEventListener("load",function(){
  if(!navigator.geolocation){
    gpsLat=13.0827;gpsLon=80.2707;
    document.getElementById("city").value="Chennai";
    document.getElementById("status").textContent="Using default: Chennai";
    calculate();return;
  }
  navigator.geolocation.getCurrentPosition(
    async function(pos){
      gpsLat=pos.coords.latitude;
      gpsLon=pos.coords.longitude;
      // Find nearest city from database
      let best="",bestDist=999;
      for(let k in CITIES){
        let c=CITIES[k];
        let dist=Math.abs(c.lat-gpsLat)+Math.abs(c.lon-gpsLon);
        if(dist<bestDist){bestDist=dist;best=k;}
      }
      let cityName=bestDist<2?best.charAt(0).toUpperCase()+best.slice(1):"Your Location";
      document.getElementById("city").value=cityName;
      document.getElementById("status").textContent="Detected: "+cityName;
      calculate();
    },
    async function(){
      try{
        let r=await fetch("https://ipapi.co/json/");
        let d=await r.json();
        gpsLat=d.latitude;gpsLon=d.longitude;
        document.getElementById("city").value=d.city||"Chennai";
        document.getElementById("status").textContent="IP Location: "+(d.city||"Chennai");
        calculate();
      }catch(e){
        gpsLat=13.0827;gpsLon=80.2707;
        document.getElementById("city").value="Chennai";
        document.getElementById("status").textContent="Using default: Chennai";
        calculate();
      }
    }
  );
});

</script>
